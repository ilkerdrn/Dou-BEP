name: DOU Reader Windows acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/dou-reader-windows.yml'
      - 'tools/dou-reader-windows*.ps1'
      - 'tools/dou-reader-windows-host.cs'
      - 'tools/dou-reader-pronunciation-check.ps1'
      - 'dou-reader-windows.test.mjs'
      - 'dou-speech-phoneme-ui.mjs'
      - 'dou-speech-phoneme-ui-race.test.mjs'
      - 'dou-speech-phoneme-study.mjs'
      - 'dou-speech-phoneme-study.test.mjs'
      - 'dou-speech-phoneme-diagnostics.mjs'
      - 'dou-speech-phoneme-diagnostics.test.mjs'
      - 'tools/exam-closure-smoke.mjs'
      - 'tools/acceptance-pilot.mjs'
      - 'exam-page-health.js'
      - 'exam-page-startup.test.mjs'
      - 'institutional-exams.html'
      - 'institutional-exams.mjs'
      - 'admin-navigation.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dou-reader-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run local-only Reader acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tools\dou-reader-windows-acceptance.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test exam editor startup and DOM assets
        shell: pwsh
        run: |
          node --test exam-page-startup.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run local phoneme study and diagnostic regression tests
        shell: pwsh
        run: |
          node --test dou-speech-phoneme-study.test.mjs dou-speech-phoneme-diagnostics.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise anonymous isolated exam approval and ZIP delivery
        shell: pwsh
        run: |
          node tools/exam-closure-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check anonymous institutional acceptance (temp database, no reports)
        shell: pwsh
        run: |
          node --input-type=module -e "import {runAcceptancePilot} from './tools/acceptance-pilot.mjs'; const r=await runAcceptancePilot({reportFile:null}); console.log('Anonymous pilot: '+r.passed+'/'+r.checks.length); if(r.failed || r.passed!==r.checks.length || r.isolatedDatabase!==true || r.productionReady!==false)process.exitCode=1;"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
